name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lancé par l'agent sur ses branches (une PR créée avec GITHUB_TOKEN ne déclenche pas `pull_request`).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django check
        run: bash scripts/agent/run.sh check

      - name: Migrations à jour
        run: bash scripts/agent/run.sh migrations

      - name: Tests
        run: bash scripts/agent/run.sh test-api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Test
        run: bash scripts/agent/run.sh test-web

      - name: Build
        run: bash scripts/agent/run.sh build-web

      - name: Format (fichiers modifiés)
        if: github.ref != 'refs/heads/main'
        run: bash scripts/agent/format-changed.sh --check
