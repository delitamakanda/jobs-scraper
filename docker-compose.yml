# LOCAL DEVELOPMENT ONLY. Ports are bound to 127.0.0.1; do not expose them.
services:
  api:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - path: .env
        required: false
    environment:
      SQLITE_PATH: /data/db.sqlite3
      DJANGO_ALLOWED_HOSTS: api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - sqlite-data:/data

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  sqlite-data:
