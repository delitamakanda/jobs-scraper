<aside class="border-r bg-white p-6">
  <div class="mb-10">
    <p class="text-xl font-bold">Happiness AI</p>
    <p class="text-sm text-zinc-600">Agent carrière Angular</p>
  </div>

  <nav class="space-y-2" aria-label="Navigation principale">
    <a
      routerLink="/dashboard"
      routerLinkActive="bg-zinc-100"
      ariaCurrentWhenActive="page"
      class="block rounded-xl px-4 py-3 text-sm font-medium"
    >
      Dashboard
    </a>

    <a
      routerLink="/jobs"
      routerLinkActive="bg-zinc-100"
      ariaCurrentWhenActive="page"
      class="block rounded-xl px-4 py-3 text-sm font-medium"
    >
      Jobs
    </a>

    <a
      routerLink="/applications"
      routerLinkActive="bg-zinc-100"
      ariaCurrentWhenActive="page"
      class="block rounded-xl px-4 py-3 text-sm font-medium"
    >
      Applications
    </a>

    <a
      routerLink="/profile"
      routerLinkActive="bg-zinc-100"
      ariaCurrentWhenActive="page"
      class="block rounded-xl px-4 py-3 text-sm font-medium"
    >
      Profile
    </a>

    @if (store.isLoggedIn()) {
      <button
        mat-button
        (click)="logout()"
        class="block w-full rounded-xl px-4 py-3 text-sm font-medium text-left text-red-700"
      >
        Logout
      </button>
    }
  </nav>
</aside>
