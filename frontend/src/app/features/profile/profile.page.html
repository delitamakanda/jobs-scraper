<section class="max-w-4xl">
    <h2 class="mb-6 text-3xl font-bold">
    Mon profil
    </h2>

    <form
    [formGroup]="form"
    (ngSubmit)="save()"
    class="space-y-4 rounded-2xl bg-white p-6 shadow-sm"
    >
    <div>
        <label>Titre</label>

        <input
        formControlName="title"
        class="mt-2 w-full rounded-xl border px-4 py-3"
        />
    </div>

    <div>
        <label>Résumé</label>

        <textarea
        formControlName="summary"
        rows="6"
        class="mt-2 w-full rounded-xl border px-4 py-3"
        ></textarea>
    </div>

    <button
        type="submit"
        class="rounded-xl bg-zinc-950 px-5 py-3 text-white"
    >
        Sauvegarder
    </button>
    </form>
</section>
