<section class="max-w-4xl">
  <h1 class="mb-6 text-3xl font-bold">Mon profil</h1>

  <form [formGroup]="form" (ngSubmit)="save()" class="space-y-4 rounded-2xl bg-white p-6 shadow-sm">
    <div>
      <label for="profile-title">Titre</label>

      <input
        id="profile-title"
        formControlName="title"
        autocomplete="organization-title"
        class="mt-2 w-full rounded-xl border px-4 py-3"
      />
    </div>

    <div>
      <label for="profile-summary">Résumé</label>

      <textarea
        id="profile-summary"
        formControlName="summary"
        rows="6"
        class="mt-2 w-full rounded-xl border px-4 py-3"
      ></textarea>
    </div>

    <div>
      <label for="profile-years">Années d'expérience</label>
      <input
        id="profile-years"
        formControlName="years_of_experience"
        type="number"
        class="mt-2 w-full rounded-xl border px-4 py-3"
      />
    </div>

    <div>
      <label for="profile-seniority">Seniority</label>
      <!-- junior, mid, senior -->
      <select
        id="profile-seniority"
        formControlName="seniority"
        class="mt-2 w-full rounded-xl border px-4 py-3"
      >
        <option value="junior">Junior</option>
        <option value="mid">Mid</option>
        <option value="senior">Senior</option>
      </select>
    </div>

    <div>
      <label for="profile-main-skills">Main skills</label>
      <input
        id="profile-main-skills"
        formControlName="main_skills"
        type="text"
        class="mt-2 w-full rounded-xl border px-4 py-3"
        placeholder="e.g., JavaScript, React, System Design"
      />
    </div>

    <div>
      <label for="profile-secondary-skills">Secondary skills</label>
      <input
        id="profile-secondary-skills"
        formControlName="secondary_skills"
        type="text"
        class="mt-2 w-full rounded-xl border px-4 py-3"
        placeholder="e.g., TypeScript, Angular, Node.js"
      />
    </div>

    <div>
      <label for="profile-industries">Industries</label>
      <select
        multiple
        id="profile-industries"
        formControlName="industries"
        class="mt-2 w-full rounded-xl border px-4 py-3"
      >
        <option value="tech">Tech</option>
        <option value="finance">Finance</option>
        <option value="healthcare">Healthcare</option>
        <option value="education">Education</option>
        <option value="e-commerce">E-commerce</option>
        <option value="gaming">Gaming</option>
        <option value="retail">Retail</option>
        <option value="other">Autre</option>
        <!-- Add more industries as needed -->
      </select>
    </div>

    <div>
      <label for="profile-projects">Projects</label>
      <input
        id="profile-projects"
        formControlName="projects"
        type="text"
        class="mt-2 w-full rounded-xl border px-4 py-3"
        placeholder="e.g., Project A, Project B, Project C"
      />
    </div>

    <div>
      <label for="profile-locations">Preferred locations</label>
      <input
        id="profile-locations"
        formControlName="preferred_locations"
        type="text"
        class="mt-2 w-full rounded-xl border px-4 py-3"
        placeholder="e.g., New York, San Francisco, London"
      />
    </div>

    <div>
      <label for="profile-remote">Remote work preference</label>
      <select
        id="profile-remote"
        formControlName="remote_preference"
        class="mt-2 w-full rounded-xl border px-4 py-3"
      >
        <option value="remote">Remote</option>
        <option value="hybrid">Hybrid</option>
        <option value="onsite">On-site</option>
      </select>
    </div>

    <div>
      <label for="profile-salary-min">Target salary min</label>
      <input
        id="profile-salary-min"
        formControlName="target_salary_min"
        type="number"
        class="mt-2 w-full rounded-xl border px-4 py-3"
      />
    </div>

    <div>
      <label for="profile-salary-max">Target salary max</label>
      <input
        id="profile-salary-max"
        formControlName="target_salary_max"
        type="number"
        class="mt-2 w-full rounded-xl border px-4 py-3"
      />
    </div>

    <div>
      <label for="profile-linkedin">LinkedIn</label>
      <input
        id="profile-linkedin"
        formControlName="linkedin_url"
        type="text"
        class="mt-2 w-full rounded-xl border px-4 py-3"
        placeholder="e.g., https://www.linkedin.com/in/username"
      />
    </div>

    <div>
      <label for="profile-github">GitHub</label>
      <input
        id="profile-github"
        formControlName="github_url"
        type="text"
        class="mt-2 w-full rounded-xl border px-4 py-3"
        placeholder="e.g., https://github.com/username"
      />
    </div>

    <button type="submit" class="rounded-xl bg-zinc-950 px-5 py-3 text-white">Sauvegarder</button>
  </form>
</section>
