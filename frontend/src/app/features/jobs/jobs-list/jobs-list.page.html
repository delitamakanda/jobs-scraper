<section class="space-y-6">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-3xl font-bold">Offres</h2>
          <p class="text-zinc-500">Toutes les opportunités analysées.</p>
        </div>

        <a routerLink="/jobs/new"
           class="rounded-xl bg-zinc-950 px-4 py-3 text-sm font-medium text-white">
          Ajouter une offre
        </a>
      </div>

      <div class="grid gap-4">
        @for (job of jobs$ | async; track job.id) {
          <a [routerLink]="['/jobs', job.id]"
             class="block rounded-2xl bg-white p-5 shadow-sm transition hover:shadow-md">
            <div class="flex items-start justify-between">
              <div>
                <h3 class="text-lg font-semibold">{{ job.title }}</h3>
                <p class="text-sm text-zinc-500">
                  {{ job.company }} · {{ job.location || 'Lieu non précisé' }}
                </p>
              </div>

              <span class="rounded-full bg-zinc-100 px-3 py-1 text-xs">
                {{ job.seniority || 'Non analysé' }}
              </span>
            </div>

            <p class="mt-4 line-clamp-2 text-sm text-zinc-600">
              {{ job.ai_summary || job.raw_description }}
            </p>
          </a>
        }
      </div>
    </section>
