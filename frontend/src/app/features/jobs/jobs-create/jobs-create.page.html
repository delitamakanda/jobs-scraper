<section class="max-w-3xl space-y-6">
      <div>
        <h2 class="text-3xl font-bold">Ajouter une offre</h2>
        <p class="text-zinc-500">
          Colle une fiche de poste, l'agent fera le tri.
        </p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4 rounded-2xl bg-white p-6 shadow-sm">
        <div>
          <label class="text-sm font-medium">Titre</label>
          <input formControlName="title"
                 class="mt-2 w-full rounded-xl border px-4 py-3" />
        </div>

        <div>
          <label class="text-sm font-medium">Entreprise</label>
          <input formControlName="company"
                 class="mt-2 w-full rounded-xl border px-4 py-3" />
        </div>

        <div>
          <label class="text-sm font-medium">URL</label>
          <input formControlName="url"
                 class="mt-2 w-full rounded-xl border px-4 py-3" />
        </div>

        <div>
          <label class="text-sm font-medium">Description</label>
          <textarea formControlName="raw_description"
                    rows="12"
                    class="mt-2 w-full rounded-xl border px-4 py-3"></textarea>
        </div>

        <button type="submit"
                class="rounded-xl bg-zinc-950 px-5 py-3 text-sm font-medium text-white">
          Sauvegarder
        </button>
      </form>
    </section>
